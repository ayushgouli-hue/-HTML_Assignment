<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
</head>

<body>

    <header>

        <h1>Contact Me</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>Student Contact Form</h2>

            <form>

                <label>Name:</label>
                <input type="text" name="name">

                <br><br>

                <label>Email:</label>
                <input type="email" name="email">

                <br><br>

                <label>Subject:</label>
                <input type="text" name="subject">

                <br><br>

                <label>Message:</label>

                <br>

                <textarea
                    name="message"
                    rows="6"
                    cols="40">
                </textarea>

                <br><br>

                <input type="submit" value="Send Message">

            </form>

        </section>

        <section>

            <h2>College Location</h2>

            <iframe
                src="https://www.google.com/maps?q=PCPS%20College%20Kupondole%20Lalitpur&output=embed"
                width="600"
                height="400">
            </iframe>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 Your Name</p>

    </footer>

</body>
</html>
