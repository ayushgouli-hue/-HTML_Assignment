<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>My Media Hub</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
          rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon"
          href="https://www.w3.org/favicon.ico">

    <style>

        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
        }

    </style>

</head>

<body>

    <h1>My Media Hub</h1>

    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/H0v7G8aQDE0"
        title="YouTube video"
        allowfullscreen>
    </iframe>

    <h2>Local Video</h2>

    <video width="500" controls>

        <source src="videos/myvideo.mp4" type="video/mp4">

        <source src="videos/myvideo.webm" type="video/webm">

        Your browser does not support the video tag.

    </video>

    <h2>Audio</h2>

    <audio controls>

        <source src="audio/myaudio.mp3" type="audio/mpeg">

        Your browser does not support the audio element.

    </audio>

    <h2>PCPS College Location</h2>

    <iframe
        src="https://www.google.com/maps?q=PCPS%20College%20Kupondole%20Lalitpur&output=embed"
        width="600"
        height="450">
    </iframe>

    <h2>External Website</h2>

    <iframe
        src="https://www.example.com"
        width="600"
        height="400">
    </iframe>

    <h2>PDF Document</h2>

    <embed
        src="files/document.pdf"
        type="application/pdf"
        width="600"
        height="500">

</body>
</html>
